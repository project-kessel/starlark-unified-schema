name: PR graph (comment)

# Posts (or updates) the schema graph diagram as a PR comment. Runs after the
# "PR graph (build)" workflow completes and has the write token needed to
# comment, but it never checks out or executes PR code — it only reads the
# artifact that build produced. This is the fork-safe alternative to
# pull_request_target, which would run untrusted PR code with a write token.

on:
  workflow_run:
    workflows: ['PR graph (build)']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post graph diagram
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-graph
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate PR association
        id: pr
        run: |
          # Require exactly one associated PR from the trusted workflow_run event.
          # An artifact can be forged to target a different PR; the event payload cannot.
          pr_count=$(echo '${{ toJSON(github.event.workflow_run.pull_requests) }}' | jq 'length')
          if [ "$pr_count" -ne 1 ]; then
            echo "::error::Expected exactly 1 associated PR, got $pr_count"
            exit 1
          fi
          pr_number=$(echo '${{ toJSON(github.event.workflow_run.pull_requests) }}' | jq '.[0].number')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Post or update comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          number: ${{ steps.pr.outputs.number }}
          header: graph-diagram
          path: comment.md
