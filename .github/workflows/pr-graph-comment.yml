name: PR Graph Comment

# Generates Mermaid diagram from schema changes and posts to PR
# Delegates to schema-graph-tools reusable workflow

on:
  pull_request:
    paths:
      - 'schema/**/*.star'
      - '.github/workflows/pr-graph-comment.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  graph-mermaid:
    uses: project-kessel/schema-graph-tools/.github/workflows/mermaid-comment.yml@main
    with:
      schema-path: schema
    secrets: inherit
